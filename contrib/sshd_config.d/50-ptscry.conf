# ptscry - Guido Cauli <guido.cauli@gmail.com>
# /etc/ssh/sshd_config.d/50-ptscry.conf
#
# L'autenticazione forte e' di sshd, non di ptscry: ptscry sta DIETRO sshd, quindi eredita
# FreeIPA/HBAC, certificati, FIDO2 e OTP di OpenSSH (codice maturo e gia' sotto audit).
# Verifica sempre il risultato con:  ptscry check -u UTENTE
#
# Requisiti: OpenSSH >= 8.7 (PubkeyAuthOptions). In sshd_config la direttiva
#   Include /etc/ssh/sshd_config.d/*.conf
# deve stare IN CIMA al file: per sshd vale il PRIMO valore trovato.
# Prima di ricaricare:  sshd -t && systemctl reload sshd   (tieni aperta una sessione di riserva)

# ---- Base per tutti (ISO 27001 A.8.5, A.8.24) --------------------------------------
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
# Algoritmi: lascia i default moderni di OpenSSH; non riabilitare quelli legacy.

# ---- Profilo 1: certificati SSH a breve durata (A.5.17) ---------------------------
# La CA firma certificati validi poche ore:
#   ssh-keygen -s /etc/ssh/ca/users_ca -I guido@elixir -n guido -V +8h -z $(date +%s) id_ed25519.pub
# (con FIDO2:  ssh-keygen -t ed25519-sk -O verify-required)
TrustedUserCAKeys /etc/ssh/ca/users_ca.pub
# Principals ammessi per ogni utente (o AuthorizedPrincipalsCommand per FreeIPA):
AuthorizedPrincipalsFile /etc/ssh/principals/%u
# Chiavi/certificati revocati (ssh-keygen -k -f /etc/ssh/revoked_keys ...):
RevokedKeys /etc/ssh/revoked_keys

# ---- Profilo 2: chiave FIDO2 con PIN (verify-required) -----------------------------
# Gruppo ptscry-fido: solo chiavi hardware, con PIN/biometria oltre al tocco.
Match Group ptscry-fido
    PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com
    PubkeyAuthOptions verify-required
    AuthenticationMethods publickey

# ---- Profilo 3: chiave + secondo fattore TOTP (PAM) --------------------------------
# Gruppo ptscry-otp: chiave (o certificato) E poi codice OTP.
# /etc/pam.d/sshd: aggiungi  auth required pam_google_authenticator.so  (e togli @include common-auth)
# oppure usa l'OTP nativo di FreeIPA tramite SSSD (pam_sss) senza moduli aggiuntivi.
Match Group ptscry-otp
    AuthenticationMethods publickey,keyboard-interactive:pam
    KbdInteractiveAuthentication yes

# ---- Profilo 4: il piu' forte = FIDO2 verify-required + OTP ------------------------
Match Group ptscry-strong
    PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com
    PubkeyAuthOptions verify-required
    AuthenticationMethods publickey,keyboard-interactive:pam
    KbdInteractiveAuthentication yes

# ---- Modalita' bastion: confina il gruppo dentro ptscry (A.8.2) --------------------
# Il login apre/riattacca la sessione "main"; ssh -t host "ptscry list|attach|new|kill" e'
# ammesso, qualunque altro comando (scp, sftp, shell, port forwarding) e' rifiutato.
# Il client deve richiedere il TTY:  ssh -t host   (o RequestTTY yes nel ~/.ssh/config).
Match Group ptscry-only
    ForceCommand /usr/local/bin/ptscry login
    PermitTTY yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitUserRC no

# Le regole di accesso (chi puo' collegarsi) restano quelle di FreeIPA/HBAC o di AllowGroups.
# Il gruppo di accesso a ptscry (access_group) e i gruppi sopra sono indipendenti: un utente
# deve poter fare login (sshd) E appartenere ad access_group (ptscry).
