# /etc/tmpfiles.d/ptscry.conf
# Tipo  Percorso                  Modo  Utente Gruppo Eta'
d       /var/log/ptscry           0750  root   root   -
d       /var/log/ptscry/rec       0700  root   root   -
# Conservazione delle registrazioni: adegua al tuo periodo di retention (policy ISMS / GDPR).
e       /var/log/ptscry/rec       -     -      -      365d
