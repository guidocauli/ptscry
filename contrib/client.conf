# ptscry - Guido Cauli <guido.cauli@gmail.com> - client.conf
#
# Linux:   ~/.config/ptscry/client.conf  (or $XDG_CONFIG_HOME/ptscry/) and /etc/ptscry/client.conf
# macOS:   ~/Library/Application Support/ptscry/client.conf
# Windows: %APPDATA%\ptscry\client.conf
# Il file dell'utente vince su quello di sistema. Su Linux/macOS deve essere dell'utente e
# non scrivibile da altri, altrimenti e' ignorato (con un avviso).

# Tasto che introduce i comandi dentro una sessione (d = stacca). Default ctrl-b.
#prefix = ctrl-b

# Server del front-end SSH di ptscry (client per macOS e Windows, o "ptscry -H" su Linux).
#server = mario@ptscry.example.org:2222

# Chiave privata (se omessa: le chiavi di ssh-agent, comprese quelle FIDO2 "sk-").
#identity = ~/.ssh/id_ed25519_sk

# Certificato SSH a breve durata, se si usa una CA.
#certificate = ~/.ssh/id_ed25519_sk-cert.pub
