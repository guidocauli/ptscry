# ptscry - Guido Cauli <guido.cauli@gmail.com>
# /etc/ptscry/ptscry.conf   (root:root, mode 0644: il monitor rifiuta file scrivibili da altri)
#
# Sezioni: [global], [group:NOME], [user:NOME]. Si applicano in quest'ordine:
# global, poi i gruppi dell'utente, poi l'utente. Chiavi sconosciute = errore.
# Le chiavi marcate (G) sono ammesse solo in [global].
# Dopo una modifica: systemctl reload ptscry-monitor (SIGHUP; una config errata viene
# rifiutata e resta quella precedente). I limiti sulle sessioni valgono subito;
# lifecycle, idle_timeout, record e simili si applicano agli host avviati dopo.

[global]
# (G) Solo i membri di questo gruppo possono usare ptscry. Vuoto = tutti (sconsigliato).
access_group = ptscry

# (G) Root puo' usare ptscry sul server anche se non e' nell'access_group (yes, default):
# root puo' gia' fare tutto sulla macchina, e l'audit registra comunque chi ha fatto login
# prima di sudo (loginuid). "no" = root solo se e' nel gruppo: per chi vuole che gli
# amministratori lavorino sempre con l'account personale. Non vale per il front-end SSH:
# da rete anche root deve essere nel gruppo.
#allow_root = yes

# (G) Chi puo' usare "ptscry admin ..." (root puo' sempre).
admin_group = ptscry-admins

# (G) Cosa possono cambiare gli amministratori senza sudo ("ptscry admin setup", GUI):
# "users keys" (default), "users", "keys" o "no". Una chiave del front-end permette di
# entrare come quell'utente: le chiavi per root, sudo/wheel/admin/adm e per gli altri
# amministratori restano comunque di root.
#admin_setup = users keys

# (G) Socket del monitor (connettibile da tutti: decide il kernel con SO_PEERCRED).
#monitor_socket = /run/ptscry/monitor.sock

# (G) Audit a catena di hash. Se non scrivibile il monitor NON opera (fail closed).
audit_log = /var/log/ptscry/audit.log

# (G) Gruppo che puo' LEGGERE l'audit (root:gruppo 0640, directory compresa): gli amministratori
# possono usare `ptscry audit-verify` e fare indagini senza root. Non scrivere nulla: la
# catena resta protetta. NON usare access_group: ogni utente vedrebbe l'attivita' di tutti.
# Se il gruppo non esiste il log resta solo di root. Senza questa riga: solo root.
audit_group = ptscry-admins

# (G) Copia dell'audit su syslog (facility authpriv): inoltrala FUORI da questo host
# (vedi contrib/rsyslog.d). Senza copia esterna chi diventa root qui puo' riscrivere il file.
audit_syslog = yes

# (G) Registrazioni (asciicast v2), scritte dal monitor: root:root 0600.
#record_dir = /var/log/ptscry/rec

# (G) Tetto alle sessioni di TUTTI gli utenti insieme (N | unlimited). Gli pseudoterminali
# sono una risorsa di sistema (kernel.pty.max): senza tetto un solo account "unlimited"
# potrebbe esaurirli e impedire anche i login ssh. Tienilo ben sotto kernel.pty.max
# (`ptscry check` lo controlla).
max_total_sessions = 1024

# (G) Servizio PAM usato per avviare ogni shell (/etc/pam.d/<nome>): account (HBAC FreeIPA),
# pam_loginuid (auid per auditd), pam_limits. "off" = nessuna sessione PAM (solo prove).
pam_service = ptscry

# --- Front-end SSH integrato (opzionale; vedi docs/MANUALE.md 3.5) -------------------
# Un processo NON privilegiato (frontend_user) termina SSH su una porta TCP e passa i
# terminali al monitor. CONFIGURAZIONE DI PARTENZA: chiavi pubbliche semplici, un file per
# utente in authorized_keys.d, niente TOTP, niente FIDO2, niente CA. Per usarla:
#   sudo make frontend-user      (account, chiave host, directory)
#   qui sotto: frontend = yes     e poi:  systemctl reload ptscry-monitor
# `ptscry check` segnala come WARN le protezioni che qui sono spente. Per alzarle cambia UNA riga:
#   frontend_require_fido2 = yes   solo chiavi sk-ssh-ed25519 con PIN/biometria
#   frontend_totp = yes            secondo fattore: `ptscry totp-init UTENTE` (crea anche la directory)
#   frontend_ca_keys = /etc/ptscry/frontend_ca.pub   certificati SSH di una CA a breve durata
#                                  (copiaci la chiave PUBBLICA della CA; puoi tenere anche le chiavi semplici)
#frontend = yes
#frontend_listen = :2222
#frontend_user = ptscry-fe
frontend_authorized_keys_dir = /etc/ptscry/authorized_keys.d   # "none" = niente chiavi semplici
frontend_require_fido2 = no
frontend_totp = no
frontend_ca_keys = none
#frontend_host_key = /etc/ptscry/ssh_host_ed25519_key
#frontend_totp_dir = /etc/ptscry/totp
#frontend_cert_max_age = 24h            # validita' massima accettata per un certificato
#frontend_max_conns = 256
#frontend_seccomp = yes                 # filtro seccomp nel front-end (x86-64)
#frontend_rate = 30                     # nuove connessioni al minuto per indirizzo (raffica 10)

# --- valori per utente / gruppo (qui i default) ---------------------------------

# exit_on_last_shell : l'host dell'utente termina con l'ultima sessione
# persistent_per_user: l'host resta attivo finche' non viene fermato
session_lifecycle = exit_on_last_shell

# Sessioni per utente: un numero (1..100000) oppure "unlimited".
max_sessions = 8

# Le sessioni staccate e inattive da piu' di questo tempo vengono terminate (30m, 12h, 7d; 0 = mai).
idle_timeout = 7d

# Durata massima di una sessione, anche se attiva (0 = nessun limite).
max_lifetime = 0

# Byte di output tenuti per il replay al reattach (0..524288).
replay_bytes = 262144

# Tasto che introduce i comandi dentro una sessione (d = stacca). Default ctrl-b, come tmux.
# Per le sessioni dal front-end SSH decide il server; sul client puo' essere
# sovrascritto da client.conf (prefix = ...).
#detach_prefix = ctrl-b

# Shell. Se omesso: la shell di login dell'utente (nologin/false = nessun accesso).
#shell = /bin/bash

# Consente "ptscry new <comando>" (altrimenti solo la shell).
allow_command = yes

# off | output | all. "all" registra anche la tastiera e quindi PUO' CATTURARE PASSWORD:
# usalo solo dove serve e con informativa agli interessati (GDPR).
# Se la registrazione e' attiva e non si puo' aprire, la sessione NON parte.
record = off

# Dimensione massima della registrazione di UNA sessione (byte, o suffisso K/M/G; 0 = nessun
# limite). Al raggiungimento la sessione viene terminata (e l'evento e' auditato): evita che un
# utente riempia il disco dove vive anche l'audit. La registrazione si ferma anche se il
# filesystem ha meno di 64 MiB liberi.
record_max_bytes = 512M

# Un account puo' essere escluso del tutto:
enabled = yes

# --- esempi ---------------------------------------------------------------------

