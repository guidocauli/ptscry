# ptscry - Guido Cauli <guido.cauli@gmail.com>
# /etc/filebeat/filebeat.yml (estratto) sul server con ptscry. Filebeat gira come root e puo'
# leggere l'audit (root 0600). L'enrichment e' nella ingest pipeline "ptscry" (ingest-pipeline.json),
# la stessa che serve se l'audit arriva da syslog.
filebeat.inputs:
  - type: filestream
    id: ptscry-audit
    paths:
      - /var/log/ptscry/audit.log
    # Segue la rotazione di logrotate (create): non servono opzioni speciali.
    # I file ruotati/compressi non vengono riletti.
    prospector.scanner.fingerprint.enabled: true

# Indici scritti a mano (niente template/ILM automatici di Filebeat: sono in index-template.json)
setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["https://elastic.example.lan:9200"]
  api_key: "${ES_API_KEY}"            # chiave con diritto di sola scrittura su ptscry-audit-*
  ssl.certificate_authorities: ["/etc/pki/elastic-ca.pem"]
  index: "ptscry-audit-%{+yyyy.MM}"
  pipeline: "ptscry"
