# ptscry - Guido Cauli <guido.cauli@gmail.com>
# /etc/rsyslog.d/50-ptscry.conf
# Inoltra l'audit di ptscry (JSON, facility authpriv, programma "ptscry") a un collettore
# FUORI da questo host. E' questa copia, non il file locale, a resistere a chi diventa root qui.
# Sostituisci LOGHOST e configura TLS (gtls/ossl) secondo la tua PKI: non inviare in chiaro.
#
# module(load="imtcp")      # sul collettore
# global(DefaultNetstreamDriver="gtls"
#        DefaultNetstreamDriverCAFile="/etc/pki/ca.pem"
#        DefaultNetstreamDriverCertFile="/etc/pki/client.pem"
#        DefaultNetstreamDriverKeyFile="/etc/pki/client.key")
if $programname == 'ptscry' then {
    action(type="omfwd" target="LOGHOST" port="6514" protocol="tcp"
           StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
           StreamDriverPermittedPeers="LOGHOST"
           queue.type="LinkedList" queue.filename="ptscry_fwd" queue.maxdiskspace="1g"
           queue.saveonshutdown="on" action.resumeRetryCount="-1")
}
