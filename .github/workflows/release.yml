# ptscry - Guido Cauli <guido.cauli@gmail.com>
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Release: on a tag v* (git tag v0.7.1 && git push origin v0.7.1), or by hand
# from the Actions tab with a tag name. Builds every package and attaches it
# to a DRAFT release: nothing is published until you press "Publish".
#   server:  deb / rpm / tar, amd64 and arm64, built natively in AlmaLinux 9
#            (glibc 2.34: the binaries run on RHEL/Alma 9, Debian 12+, Ubuntu 22.04+)
#   GUI:     Linux deb / rpm / tar, Windows setup + zip (amd64, arm64), macOS dmg
#   sources: tar.gz of the tag
# The release notes come from docs/release-notes/<tag>.md when it exists.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag of the release (created on the chosen branch if missing)"
        required: true

permissions:
  contents: read

jobs:
  server:
    name: server ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 9: glibc 2.34, so the binaries run on RHEL/Alma 9, Debian 12+, Ubuntu 22.04+
    container: almalinux:9
    steps:
      - name: build tools
        run: dnf install -y -q gcc glibc-devel git tar gzip binutils file python3 findutils
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: vet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go vet ./... && (cd tui && go vet .)
      - name: server packages
        run: PATH="$PATH:$(go env GOPATH)/bin" ./build-server.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: |
            dist-server/*.deb
            dist-server/*.rpm
            dist-server/*.tar.gz
          if-no-files-found: error

  gui-linux:
    name: GUI Linux amd64
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: build tools
        run: |
          dnf install -y -q dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y -q gcc glibc-devel git tar gzip binutils file python3 findutils pkgconf-pkg-config \
            wayland-devel libxkbcommon-devel libxkbcommon-x11-devel libX11-devel libXcursor-devel \
            libXfixes-devel mesa-libEGL-devel vulkan-loader-devel vulkan-headers
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: GUI packages (Linux)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PATH="$PATH:$(go env GOPATH)/bin" ./build-gui.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: |
            dist-gui/*.deb
            dist-gui/*.rpm
            dist-gui/*.tar.gz
          if-no-files-found: error

  gui-windows:
    name: GUI Windows
    runs-on: ubuntu-latest
    steps:
      - name: build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: GUI packages (Windows)
        run: ./build-gui.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: |
            dist-gui/*.zip
            dist-gui/*.exe
          if-no-files-found: error

  macos:
    name: GUI macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: GUI package (macOS)
        run: ./build-gui.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist-gui/*.dmg
            dist-gui/*.tar.gz
          if-no-files-found: error

  release:
    name: draft release
    needs: [server, gui-linux, gui-windows, macos]
    # a macOS runner that is missing or fails does not stop the rest
    if: ${{ !cancelled() && needs.server.result == 'success' && needs.gui-linux.result == 'success' && needs.gui-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: sources, checksums, notes
        id: prep
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          find art -type f -exec cp {} out/ \;
          git archive --format=tar.gz --prefix=ptscry/ -o "out/ptscry-${TAG#v}-src.tar.gz" HEAD
          (cd out && sha256sum * > SHA256SUMS)
          if [ -f "docs/release-notes/$TAG.md" ]; then
            cp "docs/release-notes/$TAG.md" notes.md
          else
            printf '**%s** - Guido Cauli <guido.cauli@gmail.com>\n\nSoftware fornito "cosi'"'"' com'"'"'e'"'"'", **senza alcuna garanzia**: vedi LICENSE e NOTICE.md.\n' "$TAG" > notes.md
          fi
          ls -la out
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft --target "${{ github.sha }}" \
              --title "ptscry $TAG" --notes-file notes.md
          echo "draft ready: ${{ github.server_url }}/${{ github.repository }}/releases"
          fi
